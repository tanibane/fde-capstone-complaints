version: "3.9"

services:
  # ── PostgreSQL 15 ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: clearview_postgres
    environment:
      POSTGRES_USER: clearview
      POSTGRES_PASSWORD: clearview_dev
      POSTGRES_DB: complaints
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearview -d complaints"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Node.js Backend API ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clearview_backend
    environment:
      DATABASE_URL: postgresql://clearview:clearview_dev@postgres:5432/complaints
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./agents:/app/agents          # Mount agent pipeline for Python subprocess calls
      - ./mcp-tools:/app/mcp-tools    # Mount MCP tools
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/dashboard/kpis || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Next.js 15 Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clearview_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
